# /etc/nginx/sites-available/reverse-proxy
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    add_header X-Proxy "VM1-Reverse-Proxy" always;

    # Server Utama (VM1 sendiri)
    location = / {
        try_files /index.html =404;
    }

    # Server X -> VM2
    location /x/ {
        proxy_pass http://__VM2_IP__:80/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # Server 2 -> Docker
    location /server2/ {
        proxy_pass http://__DOCKER_IP__:__DOCKER_PORT__/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # /x dan /server2 tanpa slash -> redirect ke versi dengan slash
    location = /x       { return 301 /x/; }
    location = /server2 { return 301 /server2/; }
}
